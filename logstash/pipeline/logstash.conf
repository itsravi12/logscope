input {
  beats {
    port => 5044
  }
}

filter {
  # If log came as raw string in [message], parse JSON
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
    if [parsed_json][timestamp] {
      mutate {
        add_field => {
          "timestamp" => "%{[parsed_json][timestamp]}"
          "level" => "%{[parsed_json][level]}"
          "service" => "%{[parsed_json][service]}"
          "hostname" => "%{[parsed_json][hostname]}"
          "ip_address" => "%{[parsed_json][ip_address]}"
          "req_id" => "%{[parsed_json][request_id]}"
          "log_message" => "%{[parsed_json][message]}"
        }
      }
    }
  }

  # Ensure level is uppercase
  mutate {
    uppercase => [ "level" ]
  }

  # Parse ISO8601 timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logscope-logs-%{+YYYY.MM.dd}"
  }
  # Also print to stdout for easy debugging
  stdout {
    codec => rubydebug { metadata => true }
  }
}
